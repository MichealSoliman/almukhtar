                time: "2 - 5 ساعات",
                link: "./hayu-alhamraa/"
            },
            {
                id: 20,
                title: "نقل عفش حي الشرفية جدة",
                image: "../assets/img/hayu-alsharafiyah.webp",
                description: "خدمة نقل عفش بحي الشرفية العريق والتجاري بأحدث الشاحنات مع فك وتركيب الأجهزة الكهربائية والمطابخ والستائر بضمان شامل.",
                region: "west-central",
                regionName: "وسط جدة",
                time: "2 - 4 ساعات",
                link: "./hayu-alsharafiyah/"
            }
        ];

        function renderAreas(list) {
            const grid = document.getElementById('areas-grid');
            if (!grid) return;
            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 text-lg">لم يتم العثور على أحياء مطابقة لبحثك. تواصل معنا لنقلك إلى أي حي في جدة فوراً.</div>`;
                return;
            }
            grid.innerHTML = list.map(item => `
                <div class="area-card bg-white rounded-3xl overflow-hidden shadow-md border border-gray-100 flex flex-col justify-between">
                    <div>
                        <div class="relative h-56 overflow-hidden">
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110" loading="lazy">
                            <span class="absolute top-4 right-4 bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-md">
                                <i class="fas fa-map-marker-alt ml-1"></i> ${item.regionName}
                            </span>
                        </div>
                        <div class="p-6">
                            <h2 class="text-xl font-bold text-gray-900 mb-3 hover:text-blue-600 transition-colors">
                                <a href="${item.link}">${item.title}</a>
                            </h2>
                            <p class="text-gray-600 text-sm leading-relaxed mb-4">
                                ${item.description}
                            </p>
                            <div class="flex items-center text-xs text-gray-500 border-t border-gray-100 pt-3 gap-4">
                                <span><i class="fas fa-clock text-blue-500 ml-1"></i> ${item.time}</span>
                                <span><i class="fas fa-shield-alt text-green-500 ml-1"></i> ضمان على سلامة الأثاث</span>
                            </div>
                        </div>
                    </div>
                    <div class="p-6 pt-0">
                        <a href="${item.link}" class="block text-center bg-blue-50 hover:bg-blue-600 text-blue-700 hover:text-white font-bold py-3 px-4 rounded-2xl transition-all duration-300">
                            تفاصيل الخدمة والأسعار <i class="fas fa-arrow-left mr-2 text-xs"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        let currentFilter = 'all';

        function filterAreas(region) {
            currentFilter = region;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            applyFilterAndSearch();
        }

        function applyFilterAndSearch() {
            const query = (document.getElementById('area-search').value || '').trim().toLowerCase();
            let filtered = neighborhoods;

            if (currentFilter !== 'all') {
                filtered = filtered.filter(item => item.region === currentFilter);
            }

            if (query) {
                filtered = filtered.filter(item => 
                    item.title.toLowerCase().includes(query) || 
                    item.description.toLowerCase().includes(query) ||
                    item.regionName.toLowerCase().includes(query)
                );
            }

            renderAreas(filtered);
        }

        document.getElementById('area-search').addEventListener('input', applyFilterAndSearch);

        // Initial render
        renderAreas(neighborhoods);
    </script>
</body>

</html>
